name: Verify Afterglows site

# Validate proposed changes without deploying or publishing the site.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Validate galleries
        run: npm test

      - name: Validate browser security controls
        run: npm run security:check

      - name: Build allowlisted site artifact
        run: npm run build

      - name: Validate built site paths and metadata
        run: npm run site:check
