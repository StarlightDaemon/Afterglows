name: Verify Afterglows site

# Validate proposed changes without deploying or publishing the site.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Validate galleries
        run: npm test

      - name: Validate browser security controls
        run: npm run security:check

      - name: Build allowlisted site artifact
        run: npm run build

      - name: Validate built site paths and metadata
        run: npm run site:check
