# Keep SHA-pinned GitHub Actions current. Dependabot updates the pinned commit
# and the trailing version comment together. Security updates for npm are
# enabled separately in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
