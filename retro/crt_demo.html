<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>CRT & Scanline Effects Demo</title>
    <meta name="description" content="Demo of the Afterglows CRT and retro effects library: phosphor glow, scanlines, flicker, and screen curvature applied to a video-feed panel using pure CSS.">
    <link rel="canonical" href="https://afterglows.starlightdaemon.dev/retro/crt_demo.html">
    <meta property="og:title" content="CRT &amp; Scanline Effects Demo">
    <meta property="og:description" content="Demo of the Afterglows CRT and retro effects library: phosphor glow, scanlines, flicker, and screen curvature applied to a video-feed panel using pure CSS.">
    <meta property="og:url" content="https://afterglows.starlightdaemon.dev/retro/crt_demo.html">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="crt_tools.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            width: 100%;
            max-width: 1200px;
        }

        .demo-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .label {
            font-size: 0.9rem;
            color: #888;
            font-family: monospace;
        }

        /* Custom sizing for demo boxes */
        .box {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            text-align: center;
        }

        .curve-demo-screen {
            position: relative;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background:
                radial-gradient(circle at center, rgba(0, 255, 65, 0.18) 0%, rgba(0, 0, 0, 0.82) 68%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.2));
            overflow: hidden;
        }

        .curve-demo-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, 0.04) 0 1px,
                    transparent 1px 5px);
            pointer-events: none;
        }

        .curve-demo-screen::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .curve-demo-grid {
            position: absolute;
            inset: 16px;
            background-image:
                linear-gradient(rgba(0, 255, 65, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.3) 1px, transparent 1px);
            background-size: 18px 18px;
            opacity: 0.7;
        }

        .curve-demo-label {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            font-family: 'VT323', monospace;
            font-size: 1.35rem;
            letter-spacing: 0.12em;
            color: #9bffb5;
            text-shadow: 0 0 8px rgba(155, 255, 181, 0.6);
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <main>
    <h1>CRT & Retro Effects Library</h1>

    <div class="grid">

        <!-- 1. Basic Scanlines -->
        <div class="demo-item">
            <div class="label">.terminal-box .scanlines .phosphor-glow</div>
            <div class="terminal-box scanlines phosphor-glow box">
                SYSTEM READY<br>
                INITIALIZING...
            </div>
        </div>

        <!-- 2. Flickering + Chromatic -->
        <div class="demo-item">
            <div class="label">.terminal-box .scanlines-flicker .chromatic-text</div>
            <div class="terminal-box scanlines-flicker chromatic-text box"
                style="--crt-green: #ffb000; border-color: #ffb000; color: #ffb000;">
                WARNING:<br>
                SIGNAL LOSS
            </div>
        </div>

        <!-- 3. Glitch Text -->
        <div class="demo-item">
            <div class="label">.glitch-text (data-text)</div>
            <div class="terminal-box scanlines box"
                style="--crt-green: #ff3333; border-color: #ff3333; color: #ff3333;">
                <div class="glitch-text" data-text="CORRUPTION DETECTED">
                    CORRUPTION DETECTED
                </div>
            </div>
        </div>

        <!-- 4. Screen Curve/Vignette -->
        <div class="demo-item">
            <div class="label">.screen-curve</div>
            <div class="terminal-box scanlines screen-curve box"
                style="background: #222; border:none; box-shadow:none;">
                <div class="curve-demo-screen" aria-hidden="true">
                    <div class="curve-demo-grid"></div>
                    <div class="curve-demo-label">VIDEO FEED</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Back Navigation -->
    <a href="../index.html"
        style="margin-top: 40px; color: #666; text-decoration: none; font-family: monospace; letter-spacing: 2px; transition: color 0.3s; margin-bottom: 40px;">
        &larr; BACK TO TERMINAL
    </a>
    </main>
    <style>
        a:hover {
            color: #00ff41 !important;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>

</body>

</html>
