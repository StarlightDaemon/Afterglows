<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>Matrix Rain | Classic Demo</title>
    <meta name="description" content="Classic CSS-only Matrix digital rain of falling Japanese katakana columns, animated with pure CSS keyframes and no JavaScript, from the Afterglows library.">
    <link rel="canonical" href="https://afterglows.starlightdaemon.dev/matrix_code/demo_classic.html">
    <meta property="og:title" content="Matrix Rain | Classic Demo">
    <meta property="og:description" content="Classic CSS-only Matrix digital rain of falling Japanese katakana columns, animated with pure CSS keyframes and no JavaScript, from the Afterglows library.">
    <meta property="og:url" content="https://afterglows.starlightdaemon.dev/matrix_code/demo_classic.html">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="matrix_tools.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            gap: 0;
            z-index: 0;
        }

        .m-col {
            animation-delay: calc(var(--i) * 0.1s);
        }

        /* Depth layers — far columns are small, soft, and slow; near
           columns are large, bright, and quick. Parallax without JS. */
        .m-col.far {
            font-size: 12px;
            line-height: 15px;
            opacity: 0.35;
            filter: blur(0.6px);
        }

        .m-col.mid {
            font-size: 16px;
            line-height: 20px;
            opacity: 0.65;
        }

        .m-col.near {
            font-size: 22px;
            line-height: 27px;
            opacity: 0.95;
            text-shadow:
                0 0 6px var(--matrix-glow),
                0 0 18px color-mix(in srgb, var(--matrix-glow) 65%, transparent);
        }

        /* Ambient depth: soft phosphor haze in the middle distance,
           heavy vignette at the edges — reads like a lit tube. */
        .haze {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 90% 65% at 50% 42%,
                    color-mix(in srgb, var(--matrix-glow) 7%, transparent) 0%,
                    transparent 60%),
                radial-gradient(ellipse 120% 100% at 50% 50%,
                    transparent 55%,
                    rgba(0, 0, 0, 0.55) 100%);
        }

        /* Faint scanlines over everything for texture. */
        .haze::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.18) 0 1px,
                    transparent 1px 4px);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="matrix-rain" id="rainContainer"></div>
        <div class="haze" aria-hidden="true"></div>
    </main>

    <script src="phosphor_theme.js"></script>
    <script>
        // Generate random matrix character columns across three depth layers.
        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
        const container = document.getElementById('rainContainer');
        const numCols = Math.floor(window.innerWidth / 22);

        const speeds = ['fast', 'med', 'slow'];
        const depths = ['far', 'far', 'mid', 'mid', 'mid', 'near']; // mid-weighted mix

        for (let i = 0; i < numCols; i++) {
            const col = document.createElement('div');
            const depth = depths[Math.floor(Math.random() * depths.length)];
            // Near columns skew fast, far columns skew slow — reinforces parallax.
            const speedPool = depth === 'near' ? ['fast', 'fast', 'med']
                : depth === 'far' ? ['med', 'slow', 'slow']
                : speeds;
            col.className = 'm-col ' + speedPool[Math.floor(Math.random() * speedPool.length)] + ' ' + depth;
            col.style.setProperty('--i', i);
            col.style.animationDelay = (Math.random() * 4.5) + 's';

            // Random string of characters
            let str = '';
            const len = 15 + Math.floor(Math.random() * 20);
            for (let j = 0; j < len; j++) {
                str += chars[Math.floor(Math.random() * chars.length)];
            }
            col.textContent = str;
            container.appendChild(col);
        }
    </script>
</body>

</html>
