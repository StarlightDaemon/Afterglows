<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>Matrix Rain | Phosphor Themes</title>
    <meta name="description" content="Matrix digital rain rendered through eight switchable CRT phosphor palettes — P1 green, P31 fast green, P3 amber, P4 paper white, P7 blue-white, P2 stoplight green, P14 violet, and a modern neon blue — plus film-inspired extras.">
    <link rel="canonical" href="https://afterglows.starlightdaemon.dev/matrix_code/demo_themes.html">
    <meta property="og:title" content="Matrix Rain | Phosphor Themes">
    <meta property="og:description" content="Matrix digital rain rendered through eight switchable CRT phosphor palettes — P1 green, P31 fast green, P3 amber, P4 paper white, P7 blue-white, P2 stoplight green, P14 violet, and a modern neon blue — plus film-inspired extras.">
    <meta property="og:url" content="https://afterglows.starlightdaemon.dev/matrix_code/demo_themes.html">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="matrix_tools.css">
    <link rel="stylesheet" href="/assets/css/afterglows-settings.css">
    <!-- Unified theme + font controller (applies data-phosphor/data-font before paint) -->
    <script src="/assets/js/afterglows-settings.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--matrix-bg);
            font-family: var(--ag-font, 'Courier New', monospace);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Film-inspired extras — page-local palettes, not phosphors. */
        [data-phosphor="film-blue"] {
            --matrix-color: #00aaff;
            --matrix-dim: #005e8c;
            --matrix-head: #d6f1ff;
            --matrix-glow: #00aaff;
            --matrix-bg: #020810;
        }

        [data-phosphor="film-red"] {
            --matrix-color: #ff3333;
            --matrix-dim: #8c1c1c;
            --matrix-head: #ffd9d9;
            --matrix-glow: #ff2222;
            --matrix-bg: #0f0303;
        }

        [data-phosphor="film-gold"] {
            --matrix-color: #ffaa00;
            --matrix-dim: #91600a;
            --matrix-head: #ffedc8;
            --matrix-glow: #ffaa00;
            --matrix-bg: #0d0801;
        }

        .controls {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            padding: 14px 18px;
            background: color-mix(in srgb, var(--matrix-bg) 82%, black);
            border: 1px solid var(--matrix-dim);
            box-shadow: 0 0 18px color-mix(in srgb, var(--matrix-glow) 12%, transparent);
            max-width: min(92vw, 760px);
        }

        .control-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .row-label {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--matrix-dim);
        }

        .theme-btn {
            padding: 7px 12px;
            border: 1px solid var(--matrix-dim);
            background: transparent;
            color: var(--matrix-color);
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }

        .theme-btn:hover {
            border-color: var(--matrix-color);
        }

        .theme-btn.active {
            background: var(--matrix-color);
            border-color: var(--matrix-color);
            color: var(--matrix-bg);
            text-shadow: none;
        }

        .theme-note {
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--matrix-dim);
            text-transform: uppercase;
            min-height: 1.2em;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main>
        <!-- Phosphor themes + fonts are selected from the shared gear control
             (bottom-right). This page keeps the FILM extras as a page-local,
             non-persistent showcase on top of the live rain. -->
        <div class="controls" role="group" aria-label="Film color extras">
            <div class="control-row" id="filmRow">
                <span class="row-label">FILM</span>
                <button class="theme-btn" data-film="film-blue">Resurrections</button>
                <button class="theme-btn" data-film="film-red">Virus</button>
                <button class="theme-btn" data-film="film-gold">Neon Gold</button>
            </div>
            <div class="theme-note" id="themeNote" aria-live="polite"></div>
        </div>

        <canvas id="matrix" aria-hidden="true">Decorative animated Matrix digital-rain effect with switchable color themes.</canvas>
    </main>

    <script>
        // Phosphor theme + font come from the shared controller
        // (/assets/js/afterglows-settings.js). This page adds only the
        // page-local FILM extras and the live rain canvas.
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        if (!ctx) {
            console.warn('Matrix canvas: 2d context is not available.');
            throw new Error('Canvas 2d context unavailable');
        }

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789';
        const fontSize = 16;

        function readTheme() {
            const cs = getComputedStyle(document.documentElement);
            const v = (name, fallback) => (cs.getPropertyValue(name).trim() || fallback);
            return {
                color: v('--matrix-color', '#00ff41'),
                dim: v('--matrix-dim', '#00992a'),
                head: v('--matrix-head', '#d9ffd9'),
                glow: v('--matrix-glow', '#00ff41'),
                bg: v('--matrix-bg', '#030804')
            };
        }
        let theme = readTheme();

        let width = 0, height = 0;
        let drops = [];

        function sizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function init() {
            sizeCanvas();
            const columns = Math.floor(width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops.push({
                    y: Math.random() * -(height / fontSize),
                    speed: 0.35 + Math.random() * 0.6
                });
            }
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, width, height);
        }
        init();

        let rafId = null;

        function draw() {
            ctx.globalAlpha = 0.14;
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, width, height);
            ctx.globalAlpha = 1;

            ctx.font = fontSize + "px 'Courier New', monospace";
            ctx.textBaseline = 'top';

            for (let i = 0; i < drops.length; i++) {
                const d = drops[i];
                const x = i * fontSize;
                const headY = d.y * fontSize;

                const prevY = (d.y - d.speed) * fontSize;
                if (prevY > -fontSize && prevY < height) {
                    ctx.fillStyle = Math.random() < 0.25 ? theme.color : theme.dim;
                    ctx.globalAlpha = 0.45 + Math.random() * 0.5;
                    ctx.fillText(chars[(Math.random() * chars.length) | 0], x, prevY);
                    ctx.globalAlpha = 1;
                }

                if (headY > -fontSize && headY < height + fontSize) {
                    ctx.fillStyle = theme.head;
                    ctx.shadowColor = theme.glow;
                    ctx.shadowBlur = 10;
                    ctx.fillText(chars[(Math.random() * chars.length) | 0], x, headY);
                    ctx.shadowBlur = 0;
                }

                d.y += d.speed;
                if (headY > height && Math.random() > 0.975) {
                    d.y = Math.random() * -25;
                    d.speed = 0.35 + Math.random() * 0.6;
                }
            }

            rafId = requestAnimationFrame(draw);
        }

        // ---- Theme controls ----
        const root = document.documentElement;
        const themeNote = document.getElementById('themeNote');
        const FILM_NOTES = {
            'film-blue': 'Film — Resurrections blue (not a phosphor)',
            'film-red': 'Film — Virus red (not a phosphor)',
            'film-gold': 'Film — Neon Gold (not a phosphor)'
        };
        const PHOSPHOR_NOTES = (window.AfterglowsSettings ? window.AfterglowsSettings.THEMES : [])
            .reduce((acc, t) => { acc[t.key] = t.note; return acc; }, {});

        document.querySelectorAll('[data-film]').forEach((btn) => {
            btn.addEventListener('click', () => {
                // Page-local extras: applied directly, never persisted. The
                // shared gear will re-assert a real phosphor on its next use.
                root.setAttribute('data-phosphor', btn.dataset.film);
            });
        });

        function syncControls() {
            const active = root.getAttribute('data-phosphor') || 'p1';
            document.querySelectorAll('.theme-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.film === active);
            });
            themeNote.textContent = PHOSPHOR_NOTES[active] || FILM_NOTES[active] || '';
        }

        new MutationObserver(() => {
            theme = readTheme();
            syncControls();
        }).observe(root, { attributes: true, attributeFilter: ['data-phosphor'] });
        syncControls();

        // Reduced-motion gate: render one static frame only.
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            draw();
            cancelAnimationFrame(rafId);
            rafId = null;
        } else {
            rafId = requestAnimationFrame(draw);
        }

        // Visibility pause/resume
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(rafId);
                rafId = null;
            } else if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                rafId = requestAnimationFrame(draw);
            }
        });

        // Pagehide cleanup
        window.addEventListener('pagehide', () => {
            cancelAnimationFrame(rafId);
            rafId = null;
        });

        // Debounced resize with full model rebuild
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(init, 150);
        });
    </script>
</body>

</html>
