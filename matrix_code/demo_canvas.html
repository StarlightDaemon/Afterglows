<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>Matrix Rain | Canvas Interactive</title>
    <meta name="description" content="Interactive HTML5 Canvas Matrix digital rain whose glyph columns react to the cursor with a mouse-driven brightness radius. From the Afterglows effects library.">
    <link rel="canonical" href="https://afterglows.starlightdaemon.dev/matrix_code/demo_canvas.html">
    <meta property="og:title" content="Matrix Rain | Canvas Interactive">
    <meta property="og:description" content="Interactive HTML5 Canvas Matrix digital rain whose glyph columns react to the cursor with a mouse-driven brightness radius. From the Afterglows effects library.">
    <meta property="og:url" content="https://afterglows.starlightdaemon.dev/matrix_code/demo_canvas.html">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main>
    <canvas id="matrix" aria-hidden="true">Decorative animated Matrix digital-rain effect with mouse interaction.</canvas>
    </main>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        // Fix 2 — Context null guard
        if (!ctx) {
            console.warn('Matrix canvas: 2d context is not available.');
            throw new Error('Canvas 2d context unavailable');
        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF';
        const fontSize = 16;

        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Fix 6 — Named init function for column model
        function init() {
            columns = Math.floor(canvas.width / fontSize);
            drops = Array(columns).fill(1);
        }

        // Fix 1 — RAF handle
        let rafId = null;

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Distance from mouse - stronger effect radius
                const dist = Math.sqrt((x - mouseX) ** 2 + (y - mouseY) ** 2);
                const maxRadius = 250;

                if (dist < maxRadius) {
                    // Near cursor: bright white/green with glow
                    const intensity = 1 - (dist / maxRadius);
                    const green = Math.floor(150 + intensity * 105);
                    const red = Math.floor(intensity * 200);
                    ctx.fillStyle = `rgb(${red}, ${green}, ${Math.floor(intensity * 50)})`;
                    ctx.shadowBlur = 20 * intensity;
                    ctx.shadowColor = '#00ff00';

                    // Speed boost near cursor
                    if (intensity > 0.5) drops[i] += 0.5;
                } else {
                    // Far from cursor: dim green
                    ctx.fillStyle = 'rgb(0, 60, 0)';
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.98) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            ctx.shadowBlur = 0;

            // Fix 1 — assign RAF return value inside draw
            rafId = requestAnimationFrame(draw);
        }

        // Fix 5 — Reduced-motion gate
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            // Render one static frame as a visual placeholder
            draw();
            cancelAnimationFrame(rafId);
            rafId = null;
        } else {
            // Fix 1 — assign RAF return value at initial call
            rafId = requestAnimationFrame(draw);
        }

        // Fix 3 — Visibility pause/resume
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(rafId);
                rafId = null;
            } else {
                rafId = requestAnimationFrame(draw);
            }
        });

        // Fix 4 — Pagehide cleanup
        window.addEventListener('pagehide', () => {
            cancelAnimationFrame(rafId);
            rafId = null;
        });

        // Fix 6 — Debounced resize handler with column recompute
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                init();
            }, 150);
        });
    </script>
</body>

</html>
