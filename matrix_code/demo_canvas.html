<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>Matrix Rain | Canvas Interactive</title>
    <meta name="description" content="Interactive HTML5 Canvas Matrix digital rain whose glyph columns react to the cursor with a mouse-driven brightness radius. From the Afterglows effects library.">
    <link rel="canonical" href="https://afterglows.starlightdaemon.dev/matrix_code/demo_canvas.html">
    <meta property="og:title" content="Matrix Rain | Canvas Interactive">
    <meta property="og:description" content="Interactive HTML5 Canvas Matrix digital rain whose glyph columns react to the cursor with a mouse-driven brightness radius. From the Afterglows effects library.">
    <meta property="og:url" content="https://afterglows.starlightdaemon.dev/matrix_code/demo_canvas.html">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="matrix_tools.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--matrix-bg);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--matrix-dim);
            text-transform: uppercase;
            pointer-events: none;
            animation: hint-fade 1s 6s forwards;
        }

        @keyframes hint-fade {
            to { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main>
        <canvas id="matrix" aria-hidden="true">Decorative animated Matrix digital-rain effect with mouse interaction.</canvas>
        <div class="hint" aria-hidden="true">move the cursor &middot; click for a pulse</div>
    </main>

    <script src="phosphor_theme.js"></script>
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        if (!ctx) {
            console.warn('Matrix canvas: 2d context is not available.');
            throw new Error('Canvas 2d context unavailable');
        }

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF';
        const fontSize = 17;

        // Colors come from the live CSS variable cascade so the canvas
        // follows the phosphor theme exactly like the CSS demos do.
        function readTheme() {
            const cs = getComputedStyle(document.documentElement);
            const v = (name, fallback) => (cs.getPropertyValue(name).trim() || fallback);
            return {
                color: v('--matrix-color', '#00ff41'),
                dim: v('--matrix-dim', '#00992a'),
                head: v('--matrix-head', '#d9ffd9'),
                glow: v('--matrix-glow', '#00ff41'),
                bg: v('--matrix-bg', '#030804')
            };
        }
        let theme = readTheme();
        new MutationObserver(() => { theme = readTheme(); })
            .observe(document.documentElement, { attributes: true, attributeFilter: ['data-phosphor'] });

        let width = 0, height = 0, columns = 0;
        let drops = [];

        function sizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function init() {
            sizeCanvas();
            columns = Math.floor(width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops.push({
                    y: Math.random() * -(height / fontSize),   // staggered entry
                    speed: 0.4 + Math.random() * 0.7,          // rows per frame
                    boost: 0
                });
            }
            // Hard reset the surface so stale trails don't smear after resize.
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, width, height);
        }
        init();

        let mouseX = -1e4, mouseY = -1e4;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            mouseX = -1e4;
            mouseY = -1e4;
        });

        // Click pulse: an expanding ring that briefly accelerates and
        // brightens every column it sweeps through.
        const pulses = [];
        document.addEventListener('click', (e) => {
            pulses.push({ x: e.clientX, y: e.clientY, r: 0 });
        });

        let rafId = null;

        function draw() {
            // Fade toward the theme background — this is what forms the trails.
            ctx.globalAlpha = 0.16;
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, width, height);
            ctx.globalAlpha = 1;

            ctx.font = fontSize + "px 'Courier New', monospace";
            ctx.textBaseline = 'top';

            for (const p of pulses) { p.r += 14; }

            const maxRadius = 240;

            for (let i = 0; i < drops.length; i++) {
                const d = drops[i];
                const x = i * fontSize;
                const headY = d.y * fontSize;

                const dist = Math.hypot(x - mouseX, headY - mouseY);
                const near = dist < maxRadius ? 1 - dist / maxRadius : 0;

                let pulseHit = 0;
                for (const p of pulses) {
                    const pd = Math.abs(Math.hypot(x - p.x, headY - p.y) - p.r);
                    if (pd < 50) { pulseHit = Math.max(pulseHit, 1 - pd / 50); }
                }
                const energy = Math.max(near, pulseHit);

                // Repaint last frame's head position in body color so the
                // trail stays phosphor-tinted while the head stays hot.
                const prevY = (d.y - d.speed - d.boost) * fontSize;
                if (prevY > -fontSize && prevY < height) {
                    ctx.fillStyle = energy > 0.35 ? theme.color : theme.dim;
                    ctx.globalAlpha = 0.55 + energy * 0.45;
                    ctx.fillText(chars[(Math.random() * chars.length) | 0], x, prevY);
                    ctx.globalAlpha = 1;
                }

                // Leading glyph: white-hot, glowing, hotter still near energy.
                if (headY > -fontSize && headY < height + fontSize) {
                    ctx.fillStyle = theme.head;
                    ctx.shadowColor = theme.glow;
                    ctx.shadowBlur = 8 + energy * 18;
                    ctx.fillText(chars[(Math.random() * chars.length) | 0], x, headY);
                    ctx.shadowBlur = 0;
                }

                d.boost = Math.max(0, d.boost * 0.9);
                if (energy > 0.5) { d.boost = Math.min(1.2, d.boost + energy * 0.25); }

                d.y += d.speed + d.boost;
                if (headY > height && Math.random() > 0.975) {
                    d.y = Math.random() * -20;
                    d.speed = 0.4 + Math.random() * 0.7;
                    d.boost = 0;
                }
            }

            for (let p = pulses.length - 1; p >= 0; p--) {
                if (pulses[p].r > Math.max(width, height)) { pulses.splice(p, 1); }
            }

            rafId = requestAnimationFrame(draw);
        }

        // Reduced-motion gate: render one static frame only.
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            draw();
            cancelAnimationFrame(rafId);
            rafId = null;
        } else {
            rafId = requestAnimationFrame(draw);
        }

        // Visibility pause/resume
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(rafId);
                rafId = null;
            } else if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                rafId = requestAnimationFrame(draw);
            }
        });

        // Pagehide cleanup
        window.addEventListener('pagehide', () => {
            cancelAnimationFrame(rafId);
            rafId = null;
        });

        // Debounced resize with full model rebuild
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(init, 150);
        });
    </script>
</body>

</html>
