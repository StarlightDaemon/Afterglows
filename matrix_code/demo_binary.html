<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Rain | Binary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="matrix"></canvas>


    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        // Fix 2 — Context null guard
        if (!ctx) {
            console.warn('Matrix canvas: 2d context is not available.');
            throw new Error('Canvas 2d context unavailable');
        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01';
        const fontSize = 14;

        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        // Fix 6 — Named init function for column model
        function init() {
            columns = Math.floor(canvas.width / fontSize);
            drops = Array(columns).fill(1);
            // Randomize initial positions
            for (let i = 0; i < drops.length; i++) {
                drops[i] = Math.floor(Math.random() * -50);
            }
        }

        // Run init at startup to set initial randomized positions
        init();

        // Fix 1 — RAF handle
        let rafId = null;

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `bold ${fontSize}px 'Courier New', monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Lead character is brightest
                const isLead = Math.random() > 0.97;

                if (isLead) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00ff00';
                } else {
                    // Gradient from bright to dim
                    const fade = Math.random();
                    const green = Math.floor(80 + fade * 100);
                    ctx.fillStyle = `rgb(0, ${green}, 0)`;
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.98) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            ctx.shadowBlur = 0;
            // Fix 1 — assign RAF return value inside draw
            rafId = requestAnimationFrame(draw);
        }

        // Fix 5 — Reduced-motion gate
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            // Render one static frame as a visual placeholder
            draw();
            cancelAnimationFrame(rafId);
            rafId = null;
        } else {
            // Fix 1 — assign RAF return value at initial call
            rafId = requestAnimationFrame(draw);
        }

        // Fix 3 — Visibility pause/resume
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(rafId);
                rafId = null;
            } else {
                rafId = requestAnimationFrame(draw);
            }
        });

        // Fix 4 — Pagehide cleanup
        window.addEventListener('pagehide', () => {
            cancelAnimationFrame(rafId);
            rafId = null;
        });

        // Fix 6 — Debounced resize handler with column recompute
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                init();
            }, 150);
        });
    </script>
</body>

</html>
