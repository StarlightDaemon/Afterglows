    <style>
        .error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 96px 20px;
        }

        .error-panel {
            width: min(720px, 100%);
            padding: clamp(28px, 6vw, 56px);
            border: 1px solid rgba(var(--accent-primary-rgb), 0.45);
            background: var(--bg-secondary);
            box-shadow: 0 0 32px rgba(var(--accent-primary-rgb), 0.12);
            text-align: center;
        }

        .error-code {
            margin: 0 0 12px;
            color: var(--accent-primary);
            font-size: clamp(4rem, 18vw, 9rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 0.9;
            text-shadow: 0 0 18px rgba(var(--accent-primary-rgb), 0.35);
        }

        .error-panel h1 {
            margin: 0 0 16px;
            color: var(--text-primary);
            font-size: clamp(1.4rem, 5vw, 2.2rem);
        }

        .error-panel p {
            max-width: 56ch;
            margin: 0 auto 28px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .recovery-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .recovery-links .project-link {
            min-height: 44px;
            justify-content: center;
